name: Release

# Tagging a commit (e.g. v0.1.0) builds a Windows x64 binary and attaches it
# to a new GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      # One checkout, recursive. This used to need WinPenKit beside it; it stands on
      # StrokeKit now, and WinPenKit is a submodule of the kit, so both arrive pinned with
      # the clone. recursive, because the kit's own submodule is a level further down.
      - name: Check out PenDynamicsLab
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PenDynamicsLab.csproj

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish PenDynamicsLab.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip publish output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "PenDynamicsLab-$tag-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:ASSET" `
            --title "${{ github.ref_name }}" `
            --generate-notes
